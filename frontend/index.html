<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Kani Metals admin panel for dealers, bills, payments and inventory." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Kani Metals" />
    <link rel="preload" as="image" href="/splash-logo.webp" />
    <style>
      /* Opening animation, shown until the app has loaded (hidden by src/main.jsx). */
      #app-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 22px; background: radial-gradient(circle at 50% 42%, #2a2e33 0%, #1c1f22 62%); color: #e2e6e9; font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; transition: opacity .45s ease, visibility .45s ease; }
      #app-splash.is-hidden { opacity: 0; visibility: hidden; }
      .app-splash-logo { position: relative; width: 132px; height: 132px; border-radius: 30px; animation: splash-pop .8s cubic-bezier(.2, 1.4, .4, 1) both; }
      .app-splash-logo img { display: block; width: 100%; height: 100%; border-radius: inherit; box-shadow: 0 18px 50px rgb(0 0 0 / 45%); }
      .app-splash-logo::after { content: ""; position: absolute; inset: -10px; border-radius: 38px; border: 2px solid rgb(243 111 18 / 55%); animation: splash-ring 1.6s ease-out .55s infinite; }
      .app-splash-name { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .02em; animation: splash-rise .6s ease .35s both; }
      .app-splash-name span { color: #f7953c; }
      .app-splash-bar { position: relative; width: 140px; height: 4px; overflow: hidden; border-radius: 4px; background: rgb(255 255 255 / 12%); animation: splash-rise .6s ease .5s both; }
      .app-splash-bar::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit; background: linear-gradient(90deg, #f7953c, #e0691a); animation: splash-load 1.1s ease-in-out infinite; }
      @keyframes splash-pop { from { opacity: 0; transform: scale(.55) rotate(-8deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
      @keyframes splash-ring { from { opacity: .9; transform: scale(.92); } to { opacity: 0; transform: scale(1.25); } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes splash-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #app-splash *, #app-splash *::before, #app-splash *::after { animation: none !important; } }
    </style>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Kani Metals Admin</title>
  </head>
  <body>
    <noscript>Kani Metals Admin needs JavaScript enabled to run.</noscript>
    <div id="app-splash" role="status" aria-label="Opening Kani Metals">
      <div class="app-splash-logo"><img src="/splash-logo.webp" alt="" width="132" height="132" /></div>
      <p class="app-splash-name">Kani <span>Metals</span></p>
      <div class="app-splash-bar" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
